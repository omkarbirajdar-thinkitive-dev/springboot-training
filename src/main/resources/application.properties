spring.application.name=springboot_traning
server.port=8080

# =============================================================
# MYSQL DATABASE CONFIGURATION
# =============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/myapp
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================
# JPA / HIBERNATE
# =============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================
# LIQUIBASE DATABASE MIGRATION
# =============================================================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# =============================================================
# SPRINGDOC / SWAGGER
# =============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =============================================================
# JWT SECURITY CONFIGURATION
# =============================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# =============================================================
# KEYCLOAK / OAUTH2 CONFIGURATION
# =============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/springboot-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
keycloak.token-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token
keycloak.client-id=springboot-app
keycloak.server-url=http://localhost:8081
keycloak.realm=springboot-realm
keycloak.admin-username=${KEYCLOAK_ADMIN:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# =============================================================
# SMTP EMAIL CONFIGURATION (Brevo Relay)
# =============================================================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@workforce.local}